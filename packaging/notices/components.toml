# What the FDCAD installers and app bundles ship, and under which licence (D2860).
#
# tools/third_party_notices.py turns this folder into THIRD_PARTY_NOTICES.txt and
# SOURCE_OFFER.md. Each [[component]] has:
#   id, name, version, license (SPDX), copyright (lines), texts (files under
#   packaging/licenses), and optionally files (patterns for paths inside a build,
#   without _internal/ or Contents/Frameworks/; * matches across folders),
#   platforms, part_of (the id of the component it ships inside), version_note
#   (how the version is known, when it is not stated by the file itself),
#   homepage, source (exact version archives or tags), copyleft (GPL or LGPL: it
#   goes in SOURCE_OFFER.md), modified, choice (which licence of a dual licence
#   applies and why), credit (a sentence the licence asks to show) and notes.
#
# Windows facts were read from the folder build of 2026-11-20 (recorded in
# inventory-windows.txt). macOS facts were read from the macOS arm64 wheels on PyPI;
# no full Mac build was listed (D2862). inventory-macos.txt records the OCP part of
# the app bundle (D2873). In FDCAD.app, PyInstaller writes each folder with a dot in
# its name under Contents/Frameworks with __dot__ in place of the dot, so the wheel
# folder OCP/.dylibs is OCP/__dot__dylibs. The patterns use the bundle names.

[offer]
fdcad_source = """FDCAD's source code, with the build files used to make the installers \
(`packaging/fdcad.spec`, `packaging/windows/fdcad.iss`, `packaging/macos/make_dmg.sh` and \
`.github/workflows/release.yml`), is kept in the repository https://github.com/muffism/fdcad. \
Each release is the commit tagged with its version, for example `v1.0.0`. The repository is \
private for now, so it cannot be downloaded yet. Until it is public, the written offer below \
applies."""
written_offer = """For at least three years after the last copy of this FDCAD version is given \
out, the FDCAD maintainers will give anyone who has a copy of FDCAD's object code a complete \
copy of the Corresponding Source of that version, as the GNU GPL version 3, section 6, \
defines it. That is FDCAD's source and build files, and the source of every GPL and LGPL \
component listed in part 2 of this file, in the exact versions shipped. You get it as a \
download, or on a physical medium for no more than the cost of making and sending it. To ask \
for it, write to FDCAD@proton.me, naming \
the FDCAD version (Help, About FDCAD shows it). This offer is valid for anyone who has the \
object code, not only the person who first got it."""
relinking = """FDCAD loads every LGPL library as a separate shared library file, so you can \
replace it with your own build of the same library, made from the source named above or from \
a modified version of it.

1. Windows, installed or from the folder zip: the Qt libraries are `_internal/PySide6/Qt6*.dll` \
and the Qt plugins are in `_internal/PySide6/plugins`. PySide6 is `_internal/PySide6/*.pyd` and \
`pyside6.abi3.dll`, shiboken6 is in `_internal/shiboken6`. Open CASCADE is \
`_internal/cadquery_ocp.libs/TK*.dll`, LibRaw is `raw-*.dll` and FreeImage is \
`FreeImage-*.dll` in the same folder. planegcs is `_internal/planegcs/_planegcs*.pyd`. Replace \
a file with your build of the same version and the same programming interface, keeping its \
file name (the names with a code after the dash were given by the wheel tool `delvewheel`, \
and the other libraries look for exactly those names).
2. macOS: the same files are inside `FDCAD.app/Contents/Frameworks` (Qt in `PySide6/Qt/lib`, \
Open CASCADE, FreeImage and LibRaw in `OCP/__dot__dylibs`, which PyInstaller names so in \
place of the wheel's `OCP/.dylibs`). After replacing a file, sign the app \
again with `codesign --force --deep --sign - FDCAD.app`, or macOS will not start it.
3. The portable one file `FDCAD-portable.exe` unpacks itself to a temporary folder at every \
start, so its libraries cannot be swapped in place. Use the installer or the folder zip, or \
build FDCAD from its source with your own libraries: `uv sync`, put your libraries in place \
of the ones in `.venv`, then `uv run pyinstaller packaging/fdcad.spec --noconfirm`.

Python libraries and data stay readable: no FDCAD file is encrypted or locked to a library \
version beyond its normal programming interface."""
where = """Windows: `THIRD_PARTY_NOTICES.txt`, `SOURCE_OFFER.md` and `LICENSE` are beside \
`FDCAD.exe` in the install folder and in the folder zip, and in Help, About FDCAD, Licenses. \
macOS: they are in `FDCAD.app/Contents/Resources`, beside the app on the disk image, and in \
Help, About FDCAD, Licenses."""

