[project]
name = "fdcad"
version = "1.0.0"
description = "Open source parametric part modeler"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Muffism", email = "312291949+muffism@users.noreply.github.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "cadquery-ocp==8.0.1.1.0",
    "numpy==2.5.4",
    "planegcs==0.9.6",
    "pyside6-essentials==6.12.0",
]

[project.gui-scripts]
fdcad = "fdcad.app:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.17.2",
    "xmlschema>=4.3.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.13"
files = ["src/fdcad"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fdcad.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
markers = [
    "slow: long stress runs, skipped unless --run-slow or FDCAD_RUN_SLOW=1",
    "real_version: save files with the real app version, not the fixtures one",
]
